services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "5674:5674"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "*"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
